    '<p class="hint" style="margin-top:8px">'+esc(u.storageNote)+'</p>'+
    '<div class="row" style="margin-top:14px"><button class="btn ghost" id="exportBtn">'+esc(u.showBackup)+'</button>'+
    '<button class="btn ghost" id="importBtn">'+esc(u.restoreBackup)+'</button></div>'+
    '<div class="row" style="margin-top:10px"><button class="btn danger" id="resetAll">'+esc(u.resetAll)+'</button></div></div>';
}

function render(){
  const c = compute();
  renderChrome();
  renderReadout(c); renderTiles(c); renderStrip(c); renderBack(c);
  renderNext(c); renderNudge(c); renderJourney(c); renderNutrition(); renderCaveats(); renderYou(c);
  ["today","journey","nutrition","caveats","you"].forEach(v=> $("#view-"+v).hidden = (v !== currentView));
}
function tick(){ const c = compute(); renderReadout(c); renderTiles(c); }

/* ══════════════════════════════════════════════════════════════════════
   SHEETS
   ══════════════════════════════════════════════════════════════════════ */

function closeSheet(){ unitsPreview = null; $("#modal").innerHTML = ""; }
function openSheet(title, body, after){
  $("#modal").innerHTML = '<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" '+
    'aria-label="'+esc(title)+'"><div class="sheet-h"><h3>'+esc(title)+'</h3>'+
    '<button class="x" data-close aria-label="'+esc(T.ui.close)+'">✕</button></div>'+body+'</div></div>';
  if(after) after();
}

function openSource(id){
  const q = T.sources[id], u = T.ui; if(!q) return;
  openSheet(q.h, '<dl class="kv">'+
    '<dt>'+esc(u.sValue)+'</dt><dd>'+esc(q.value)+'</dd>'+
    '<dt>'+esc(u.sSource)+'</dt><dd>'+esc(q.origin)+'</dd>'+
    '<dt>'+esc(u.sMethod)+'</dt><dd>'+esc(q.method)+'</dd>'+
    '<dt>'+esc(u.sLimit)+'</dt><dd>'+esc(q.limit)+'</dd></dl>'+
    '<div class="formula">'+esc(q.formula)+'</div>');
}

function openLog(day){
  const u = T.ui, d = day || iso(new Date());
  const existing = S.entries[d];
  const when = d === iso(new Date()) ? u.logToday : u.logOn(dfmt().format(new Date(midnight(d))));
  openSheet(u.logTitle(when),
    '<div class="log-grid">'+ u.logTypes.map(x=>
      '<button class="chip" data-log="'+x[0]+'" aria-pressed="'+(!!existing && existing.typ===x[0])+'">'+esc(x[1])+'</button>').join("")+'</div>'+
    '<p class="hint" style="margin-top:16px">'+esc(u.logHint)+'</p>'+
    (existing ? '<div class="row" style="margin-top:12px"><button class="btn ghost" data-log="">'+esc(u.logDelete)+'</button></div>' : ''),
    ()=>{
      document.querySelectorAll("[data-log]").forEach(b=> b.onclick = ()=>{
        const v = b.dataset.log;
        if(v === ""){ delete S.entries[d]; closeSheet(); commit(); return; }
        if(v === "meat" || v === "fish"){ openLogAmount(d, v); return; }
        S.entries[d] = {typ:v}; closeSheet(); commit();
      });
    });
}

function openLogAmount(d, typ){
  const u = T.ui, def = Math.round(K.portionG * U().small.f);
  openSheet(typ === "fish" ? u.amtFish : u.amtMeat,
    '<p class="ob-p">'+esc(u.amtIntro)+'</p>'+
    (typ === "meat" ? '<div class="field"><label for="lArt">'+esc(u.amtWhich)+'</label><select id="lArt">'+
      ["beef","pork","poultry"].map(a=>'<option value="'+a+'">'+esc(u.meatNames[a])+'</option>').join("")+
      '</select></div>' : '')+
    '<div class="field"><label for="lG">'+esc(u.amtHow)+' ('+esc(U().small.u)+')</label>'+
    '<div class="hint">'+esc(u.amtHint(small(150)))+'</div>'+
    '<input type="number" id="lG" value="'+def+'" min="1" step="1"></div>'+
    '<div class="field"><label for="lNote">'+esc(u.amtNote)+'</label>'+
    '<input type="text" id="lNote" placeholder="'+esc(u.amtNotePh)+'"></div>'+
    '<div class="row" style="margin-top:20px"><button class="btn wide" id="lSave">'+esc(u.amtSave)+'</button></div>',
    ()=>{ $("#lSave").onclick = ()=>{
        setFloor();
        const shown = Math.max(1, Number($("#lG").value) || def);
        S.entries[d] = { typ, art: typ === "meat" ? $("#lArt").value : "fish",
          g: shown / U().small.f, note: $("#lNote").value.trim() };
        closeSheet(); commit();
      }; });
}

function openSetup(){
  const u = T.ui, prev = S.demo ? null : S;
  let draft = { start: prev ? prev.start : iso(new Date()),
    country: prev ? prev.country : S.country, level: "average",
    units: prev ? prev.units : S.units, unitsTouched: !!prev,
    w: Object.assign({}, prev ? prev.w : COUNTRIES[S.country].w),
    mix: Object.assign({}, prev ? prev.mix : MIX_DEFAULT),
    focus: prev ? prev.focus : "animals" };
  let step = 0; const total = 4;

  function draw(){
    unitsPreview = draft.units;
    const bar = '<div class="steps">'+Array.from({length:total},(_,i)=>'<i class="'+(i<=step?"on":"")+'"></i>').join("")+'</div>';
    let b = "";
    if(step===0) b = '<div class="ob-h">'+esc(u.s0h)+'</div><p class="ob-p">'+esc(u.s0p)+'</p>'+
      '<div class="field"><label for="oD">'+esc(u.s0l)+'</label>'+
      '<input type="date" id="oD" value="'+draft.start+'" max="'+iso(new Date())+'"></div>';
    if(step===1){
      const tot = Object.values(draft.w).reduce((x,y)=>x+y,0);
      b = '<div class="ob-h">'+esc(u.s1h)+'</div><p class="ob-p">'+esc(u.s1p)+'</p>'+
      '<div class="chips" style="margin-top:14px">'+Object.keys(COUNTRIES).map(k=>
        '<button class="chip" data-country="'+k+'" aria-pressed="'+(draft.country===k)+'">'+esc(u.countries[k])+'</button>').join("")+'</div>'+
      '<div class="chips" style="margin-top:8px">'+
        [["metric",u.unitMetric],["imperial",u.unitImperial]].map(x=>
        '<button class="chip" data-setunits="'+x[0]+'" aria-pressed="'+(draft.units===x[0])+'">'+esc(x[1])+'</button>').join("")+'</div>'+
      '<div class="chips" style="margin-top:8px">'+Object.keys(LEVELS).map(k=>
        '<button class="chip" data-level="'+k+'" aria-pressed="'+(draft.level===k)+'">'+esc(u.levels[k])+'</button>').join("")+'</div>'+
      Object.keys(MEAT).map(a=>'<div class="slider-row"><span class="nm">'+esc(u.meatNames[a])+'</span>'+
        '<input type="range" data-w="'+a+'" min="0" max="1600" step="10" value="'+(draft.w[a]||0)+'">'+
        '<span class="amt" data-amt="'+a+'">'+small(draft.w[a]||0)+'</span></div>').join("")+
      '<p class="hint" style="margin-top:14px">'+u.s1total(mass(tot/1000))+'</p>';
    }
    if(step===2){
      const mv = mixValues(draft.mix);
      b = '<div class="ob-h">'+esc(u.s2h)+'</div><p class="ob-p">'+esc(u.s2p)+'</p>'+
      Object.keys(SUBS).map(k=>{
        const share = (mv.shares.find(s=>s.k===k)||{}).p || 0;
        return '<div class="mix-row"><div class="top"><span'+(share?'':' class="off"')+'>'+esc(u.subNames[k])+'</span>'+
        '<b data-mixp="'+k+'">'+(share?share+"%":"–")+'</b></div>'+
        '<input type="range" data-mix="'+k+'" min="0" max="100" step="5" value="'+(draft.mix[k]||0)+'" '+
        'aria-label="'+esc(u.s2aria(u.subNames[k]))+'"></div>';
      }).join("")+'<p class="hint" data-mixinfo style="margin-top:16px"></p>';
    }
    if(step===3) b = '<div class="ob-h">'+esc(u.s3h)+'</div><p class="ob-p">'+esc(u.s3p)+'</p>'+
      '<div class="chips" style="margin-top:14px;flex-direction:column">'+
      ["animals","co2","water","money"].map(id=>
        '<button class="chip" data-focus="'+id+'" aria-pressed="'+(draft.focus===id)+'" style="width:100%">'+
        esc(u.focusNames[id])+'</button>').join("")+
      '</div><p class="hint" style="margin-top:16px">'+esc(u.s3foot)+'</p>';
    const nav = '<div class="row" style="margin-top:22px;gap:8px">'+
      (step>0?'<button class="btn ghost" data-back>'+esc(u.back)+'</button>':'')+
      '<button class="btn" data-next style="flex:1">'+esc(step===total-1?u.start:u.next)+'</button></div>';
    openSheet(u.setTitle, bar+b+nav, wire);
  }

  function applyPreset(){
    const base = COUNTRIES[draft.country].w, f = LEVELS[draft.level];
    draft.w = {}; for(const a in base) draft.w[a] = Math.round(base[a]*f/10)*10;
  }

  function wire(){
    const oD = $("#oD"); if(oD) oD.onchange = ()=>{ if(oD.value) draft.start = oD.value; };
    document.querySelectorAll("[data-country]").forEach(b=> b.onclick = ()=>{
      draft.country = b.dataset.country;
      if(!draft.unitsTouched) draft.units = COUNTRIES[draft.country].units;
      applyPreset(); draw(); });
    document.querySelectorAll("[data-setunits]").forEach(b=> b.onclick = ()=>{
      draft.units = b.dataset.setunits; draft.unitsTouched = true; draw(); });
    document.querySelectorAll("[data-level]").forEach(b=> b.onclick = ()=>{
      draft.level = b.dataset.level; applyPreset(); draw(); });
    document.querySelectorAll("[data-w]").forEach(r=> r.oninput = ()=>{
      draft.w[r.dataset.w] = Number(r.value);
      document.querySelector('[data-amt="'+r.dataset.w+'"]').textContent = small(draft.w[r.dataset.w]);
      const t = document.querySelector("[data-total]");
      if(t) t.textContent = mass(Object.values(draft.w).reduce((x,y)=>x+y,0)/1000);
    });
    document.querySelectorAll("[data-focus]").forEach(b=> b.onclick = ()=>{
      draft.focus = b.dataset.focus;
      document.querySelectorAll("[data-focus]").forEach(x=> x.setAttribute("aria-pressed", x===b));
    });
    function mixInfo(){
      const mv = mixValues(draft.mix);
      document.querySelectorAll("[data-mixp]").forEach(el=>{
        const a = (mv.shares.find(x=>x.k===el.dataset.mixp)||{}).p || 0;
        el.textContent = a ? a+"%" : "–";
        const nm = el.parentElement.firstElementChild;
        if(nm) nm.className = a ? "" : "off";
      });
      const info = document.querySelector("[data-mixinfo]");
      if(info) info.innerHTML = mv.shares.length
        ? u.s2info(nf(1).format(mv.co2), cur()+nf(2).format(mv.price)) : esc(u.s2none);
    }
    document.querySelectorAll("[data-mix]").forEach(r=> r.oninput = ()=>{
      draft.mix[r.dataset.mix] = Number(r.value); mixInfo(); });
    if(document.querySelector("[data-mixinfo]")) mixInfo();
    const back = document.querySelector("[data-back]"); if(back) back.onclick = ()=>{ step--; draw(); };
    document.querySelector("[data-next]").onclick = ()=>{
      if(step < total-1){ step++; draw(); return; }
      if(S.demo){ S.entries = {}; S.floor = {}; }
      S.start = draft.start; S.country = draft.country; S.units = draft.units;
      S.w = draft.w; S.mix = draft.mix; S.focus = draft.focus;
      closeSheet(); commit();
    };
  }
  draw();
}

/* ══════════════════════════════════════════════════════════════════════
   EVENTS
   ══════════════════════════════════════════════════════════════════════ */

document.addEventListener("click", e=>{
  const u = T.ui;
  const tab = e.target.closest("[data-view]");
  if(tab){
    currentView = tab.dataset.view;
    document.querySelectorAll("[data-view]").forEach(b=> b.setAttribute("aria-selected", b.dataset.view===currentView));
    ["today","journey","nutrition","caveats","you"].forEach(v=> $("#view-"+v).hidden = (v !== currentView));
    window.scrollTo({top:0, behavior:"instant"});
    return;
  }
  if(e.target.closest("[data-close]") || e.target.matches("[data-scrim]")){ closeSheet(); return; }
  const w = e.target.closest(".why"); if(w){ openSource(w.dataset.src); return; }
  const dot = e.target.closest(".dot[data-day]"); if(dot){ openLog(dot.dataset.day); return; }
  if(e.target.closest("#logBtn") || e.target.closest("#logBtn2")){
    if(S.demo){ openSetup(); } else { openLog(); } return;
  }
  if(e.target.closest("#startSetup") || e.target.closest("#editAll")){ openSetup(); return; }
  const lg = e.target.closest("[data-lang]");
  if(lg){ S.lang = lg.dataset.lang; T = LOCALES[S.lang] || EN; commit(); return; }
  const un = e.target.closest("[data-units]");
  if(un){ S.units = un.dataset.units; commit(); return; }
  if(e.target.closest("#resetPrices")){ S.prices = {meat:{}, subs:{}}; commit(); return; }
  const th = e.target.closest("[data-theme-set]");
  if(th){
    const v = th.dataset.themeSet;
    if(v === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", v);
    try{ v === "auto" ? localStorage.removeItem(KEY+"-theme") : localStorage.setItem(KEY+"-theme", v); }catch(err){}
    render(); return;
  }
  if(e.target.closest("#exportBtn")){
    openSheet(u.backupH, '<p class="ob-p">'+esc(u.backupP)+'</p>'+
      '<div class="field"><textarea id="expTa" readonly>'+esc(JSON.stringify(S))+'</textarea></div>',
      ()=>{ const t = $("#expTa"); t.focus(); t.select(); }); return;
  }
  if(e.target.closest("#importBtn")){
    openSheet(u.restoreH, '<p class="ob-p">'+esc(u.restoreP)+'</p>'+
      '<div class="field"><textarea id="impTa" placeholder="{ … }"></textarea></div>'+
      '<div class="row" style="margin-top:16px"><button class="btn wide" id="impGo">'+esc(u.restoreBtn)+'</button></div>'+
      '<p class="hint" id="impMsg" style="margin-top:10px"></p>',
      ()=>{ $("#impGo").onclick = ()=>{
          try{ const o = JSON.parse($("#impTa").value);
               if(!o || !o.start) throw new Error(T.ui.noStart);
               S = normalize(o); T = LOCALES[S.lang] || EN; closeSheet(); commit();
          }catch(err){ $("#impMsg").textContent = T.ui.restoreErr(err.message); }
        }; }); return;
  }
  if(e.target.closest("#resetAll")){
    openSheet(u.resetH, '<p class="ob-p">'+esc(u.resetP)+'</p>'+
      '<div class="row" style="margin-top:20px;gap:8px"><button class="btn ghost" data-close style="flex:1">'+esc(u.cancel)+'</button>'+
      '<button class="btn danger" id="reallyReset" style="flex:1">'+esc(u.del)+'</button></div>',
      ()=>{ $("#reallyReset").onclick = ()=>{
          try{ localStorage.removeItem(KEY); }catch(err){}
          if(dbRef) dbRef.delete().catch(()=>{});
          S = demoState(); T = LOCALES[S.lang] || EN; closeSheet(); render();
        }; });
  }
});

document.addEventListener("change", e=>{
  const p = e.target.closest("[data-price]");
  if(!p) return;
  const parts = p.dataset.price.split(":"), group = parts[0], key = parts[1];
  const shown = Number(p.value);
  if(isNaN(shown) || shown < 0){ render(); return; }
  if(!S.prices) S.prices = {meat:{}, subs:{}};
  S.prices[group][key] = shown * U().mass.f;
  commit();
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeSheet(); });

render();
setInterval(tick, 1000);
</script>
