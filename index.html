<style>

  --panel:#16241C; --panel-ink:#DCE8DF; --panel-dim:#6E8478; --glow:#7FD3A3;

  --danger:#9C4A38;
  --shadow:0 1px 2px rgba(22,36,28,.06), 0 8px 24px -12px rgba(22,36,28,.18);
  --display:"Bricolage Grotesque","Archivo",system-ui,sans-serif;

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){

    --panel:#0A100C; --panel-ink:#CFE3D5; --panel-dim:#5E7268; --glow:#86E0AC;
    --ink:#E6EDE7; --ink-2:#A3B2A8; --ink-3:#7A897F;
    --line:#2A342D; --line-2:#39453C;
    --accent:#6BC48D; --accent-soft:#1E3227; --accent-ink:#A8DEBF;
    --danger:#D08672;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#171E19; --surface-2:#1F2822; --surface-3:#2A342D;
  --panel:#0A100C; --panel-ink:#CFE3D5; --panel-dim:#5E7268; --glow:#86E0AC;
  --ink:#E6EDE7; --ink-2:#A3B2A8; --ink-3:#7A897F;
  --line:#2A342D; --line-2:#39453C;

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;

}

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   REFERENCE DATA — one global dataset throughout.

   Climate, land and freshwater all come from Poore & Nemecek 2018
   (Science): ~38,700 farms across 119 countries. Using a single dataset
   for all three means meat and its replacement are always measured the
   same way, so the difference between them actually means something.

   Water is FRESHWATER WITHDRAWAL, not total water footprint — the scarce
   kind. That is why beef sits below pork here and cheese above everything.
   ══════════════════════════════════════════════════════════════════════ */

const MEAT = {
  beef:    { co2:60.0, land:185,  water:2080, price:{US:12.0, DE:16.0, GLOBAL:11.0} },
  pork:    { co2:12.3, land:17.4, water:1796, price:{US:8.5,  DE:9.7,  GLOBAL:7.5} },
  poultry: { co2:9.9,  land:12.2, water:660,  price:{US:7.5,  DE:9.0,  GLOBAL:6.0} },
  fish:    { co2:11.0, land:4.2,  water:1850, price:{US:15.0, DE:17.0, GLOBAL:12.0} }
};
/* Boneless edible meat per animal, kilograms — one basis for all four,
   because edible weight is what people enter. Carcass weights (pig ~90,

/* Scarborough et al. 2023, Nature Food — measured diets of ~55,000 people,
   kg CO2e per day per 2000 kcal: high meat (>100 g/day) 10.24, medium 7.55,
   low 5.37, vegetarian 3.81. These are the resulting differences to the
   vegetarian group, by daily meat intake. The climate counter is anchored
   to this curve rather than built bottom-up, because a bottom-up swap
   calculation came out roughly a third of the measured difference.

   Above 150 g/day the value is held flat: that is the mean of the highest
   group actually measured, and extrapolating past it would quickly claim a
   larger saving than the whole meat-eating diet weighs. */
const DIET_ANCHORS = [{g:0, d:0}, {g:25, d:1.56}, {g:75, d:3.74}, {g:150, d:6.43}];
function measuredDailySaving(gPerDay){
  if(gPerDay <= 0) return 0;
  const last = DIET_ANCHORS[DIET_ANCHORS.length-1];
  if(gPerDay >= last.g) return last.d;
  for(let i = 1; i < DIET_ANCHORS.length; i++){
    const a = DIET_ANCHORS[i-1], b = DIET_ANCHORS[i];
    if(gPerDay <= b.g) return a.d + (b.d - a.d) * (gPerDay - a.g) / (b.g - a.g);
  }
  return last.d;
}

{d:159,at:{m:"co2",v:100},k:"planet",t:"A hundred kilos of CO₂e",b:"Roughly 480 km in an average car. The honest range is wide — it depends on the data basis and on what landed on the plate instead.",q:"Poore & Nemecek 2018; IEA fleet emission factors"},
{d:180,k:"habit",t:"Six months — good time for bloodwork",b:"A full blood count and ferritin, ideally alongside CRP, since inflammation pushes ferritin up. Mention that you eat vegetarian; it changes what gets looked at. No guideline sets this interval — it's practice, not law.",q:"WHO ferritin guideline 2020; interval is convention"},
{d:202,at:{m:"chicken",v:5},k:"animals",t:"Five chickens",b:"Almost all poultry, and that's the point of this chapter: poultry is a quarter of the weight but nine out of ten animals. Weight sits in beef, animals sit in chicken.",q:"FAO production statistics; own calculation"},
{d:250,k:"animals",t:"You've stopped counting",b:"Somewhere around here people stop treating this as a project and start treating it as a fact about themselves. That shift — from what you do to what you are — is the one that predicts whether it lasts.",q:"Identity-based habit research; self-perception theory"},
{d:270,k:"habit",t:"About eight hundred meals",b:"Roughly what you've eaten since the start. Most of them were unremarkable, which is the best possible outcome: this stopped being a decision and became lunch.",q:"Your own figures"},
{d:300,k:"animals",t:"The fish you never see",b:"Around a tenth of what fishing fleets land is bycatch — animals caught and discarded. Because they're smaller, they add more individuals per kilo than the fish you actually eat. Your counter includes them.",q:"Pérez Roda et al. 2019, FAO — global discard estimate"},
{d:365,k:"planet",t:"One year of climate math",b:"A real, well-evidenced contribution — and a larger one than most people expect. Measured across tens of thousands of diets, dropping meat is among the biggest single changes a household can make: for a former heavy meat eater it runs to roughly two tonnes of CO₂e a year, about a long-haul return flight. It still leaves electricity, heating and travel untouched, and it remains a comparison between groups of people rather than a measurement of you.",q:"Poore & Nemecek 2018; Scarborough et al. 2023, Nature Food; national consumption-based footprint data"},
{d:365,k:"money",t:"One year of money",b:"Replacing meat mostly with pulses, grains and vegetables saves real money over a year. Replacing it with cheese saves little. Your receipts beat our estimate — adjust the prices under You.",q:"Own model from retail price surveys"},
{d:365,k:"body",t:"One year — the honest part",b:"Get B12, ferritin and vitamin D checked once. Lacto-ovo vegetarians average lower B12 and lower iron stores than meat eaters; both are easy to manage, but only if you know about them.",q:"Gilsing et al. 2010, Eur J Clin Nutr; Haider et al. 2018"},
{d:400,k:"habit",t:"You are somebody's example now",b:"After a year, people around you have stopped asking whether it's a phase. You don't have to argue for anything — the most persuasive thing available to you is simply eating well in front of people and not making it their problem.",q:"Social norm research; Sparkman & Walton 2017"},
{d:500,k:"planet",t:"Five hundred days",b:"Long enough that the yearly rate is the number that matters, not the total. Whatever your figure is per year, it now repeats without you thinking about it. That's what makes diet changes worth more than one-off gestures.",q:"Poore & Nemecek 2018"},
{d:548,k:"animals",t:"Eighteen months",b:"A year and a half. The animal counter is dominated by poultry, which means the thing driving it is the most ordinary item on the menu — not the steak anyone argues about.",q:"FAO production statistics; own calculation"},
{d:730,k:"animals",t:"Two years — and what doesn't change",b:"About twenty land animals, overwhelmingly broiler chickens. The part we won't leave out: eggs and dairy keep laying hens and dairy cows in the picture, and both are eventually slaughtered. Vegetarian isn't animal-free.",q:"FAO production statistics; laying-hen productivity data"},
{d:981,at:{m:"pig",v:1},k:"animals",t:"A whole pig",b:"About 57 kg of pork — the edible boneless yield of one pig, which lives roughly six months. Pork is the world's most-eaten meat by weight, but per kilo it carries about a fifth of beef's climate cost.",q:"FAO production statistics; Poore & Nemecek 2018"},
{d:1079,at:{m:"co2",v:500},k:"planet",t:"A long-haul flight",b:"Roughly 500 kg CO₂e — about one long round-trip flight, including the extra warming effects at altitude. Depending on the method, the same flight is calculated anywhere from half to double that.",q:"Poore & Nemecek 2018; aviation emission calculators"},
{d:1095,k:"habit",t:"Three years",b:"At this point the interesting question isn't whether you'll keep going. It's that you've quietly built a repertoire — a dozen meals you can make without looking anything up. That repertoire is the actual infrastructure here.",q:"Your own figures"},
{d:1500,k:"planet",t:"Four years, compounding",b:"Nothing dramatic happens at this point, and that's the finding. The value of a diet change is that it accrues every single day without further decisions, which is the opposite of how most environmental effort works.",q:"Poore & Nemecek 2018"},
{d:1825,k:"body",t:"Five years — no number here on purpose",b:"Plenty of apps count added days of life. We can't: the large cohorts disagree. One found vegetarians slightly lower on all-cause mortality, another found no difference. The most telling figure is that both cohorts as a whole died at about half the national rate — vegetarians and meat eaters alike.",q:"Orlich et al. 2013, JAMA Intern Med; Key et al. 2009, Am J Clin Nutr"},
{d:2190,k:"habit",t:"Six years",b:"Long enough that you've been through every awkward situation this creates — the wedding, the work trip, the relative who takes it personally — and found a way through each one. That's not willpower any more, it's just experience.",q:"Your own figures"},
{d:2555,k:"body",t:"Colorectal cancer — two answers",b:"Processed meat is IARC Group 1: the link to bowel cancer is considered established, though the group says nothing about how large the risk is. The two big cohorts then contradict each other on vegetarians. We'd rather tell you that than pick a side.",q:"IARC/WHO 2015; Orlich et al. 2015; Key et al. 2009"},
{d:2920,k:"animals",t:"Eight years",b:"Enough that the total has stopped being an abstraction. Whatever the exact figure, the direction has never been in doubt — and unlike almost everything else in this app, this counter needs no assumptions about anyone but you.",q:"FAO production statistics; own calculation"},
{d:3650,k:"body",t:"Ten years: the most solid long-term finding",b:"In EPIC-Oxford, vegetarians had about ten fewer cases of coronary heart disease per thousand people over ten years. A meta-analysis of eight cohorts confirms the direction and grades it probable. It's observational — a comparison between groups, not a before-and-after in you.",q:"Tong et al. 2019, BMJ; Dybvik et al. 2023, Eur J Nutr (RR 0.79)"},
{d:4200,k:"body",t:"An underrated win: diverticular disease",b:"Rarely discussed, and it puts a lot of people in hospital. In EPIC-Oxford, vegetarians had about a third lower risk of being admitted for it over 11.6 years, with fibre intake helping independently on top.",q:"Crowe et al. 2011, BMJ — EPIC-Oxford, n=47,033"},
{d:5475,k:"habit",t:"Fifteen years",b:"Most things people start don't run this long. There's no badge that means much at this range — but if you started this hoping it would become unremarkable, it has, and that was always the win condition.",q:"Your own figures"},
{d:6570,k:"body",t:"The uncomfortable number: stroke",b:"The same study that shows ten fewer heart disease cases also found about 20 percent more strokes among vegetarians, mostly haemorrhagic. A twelve-cohort meta-analysis did not find that effect. You're reading it here so you don't first hear it as an accusation.",q:"Tong et al. 2019, BMJ (HR 1.20); Dybvik et al. 2023 (RR 0.90, n.s.)"},
{d:7300,k:"animals",t:"Twenty years",b:"A couple of hundred land animals, nearly all broilers. You will probably never see a whole cow in this app — one animal yields around 150 kg of boneless meat, which takes some fifteen years at average consumption. Weight sits in beef, animals sit in chicken.",q:"FAO production statistics; own calculation"}

nutrition:[
{h:"Iron",b:"Plant iron is absorbed less readily than iron from meat. Vitamin C in the same meal improves it substantially; coffee and black tea reduce it. Good sources: pulses, oats, pumpkin seeds, millet. Reference intakes run around 16 mg a day for menstruating women and 11 mg for men. Have ferritin checked after six months, ideally alongside CRP, since inflammation inflates it."},
{h:"Vitamin B12",b:"Eggs and dairy usually cover it, but often narrowly: lacto-ovo vegetarians average clearly lower levels than meat eaters, and a small share sit in the deficient range. If you eat few eggs and little dairy, ask for holo-transcobalamin rather than plain serum B12 — it picks up a shortfall earlier."},
{h:"Iodine",b:"Sea fish was one of the main sources, and it's gone now. Use iodised salt — the simplest lever there is. In regions with iodised salt programmes this is usually enough; where there aren't any, it's worth asking about. Seaweed is potent but wildly variable in dose."},
{h:"Omega-3",b:"Losing fish means losing EPA and DHA. Flaxseed, walnuts and rapeseed oil supply ALA, but the body converts only a few percent of it, and less in men. Algae oil at around 250 mg EPA plus DHA a day is the one direct source that remains. Not mandatory — but if you take it, the cost belongs in your money tile."},
{h:"Zinc and selenium",b:"Phytate from whole grains and legumes binds zinc, so requirements are higher than for meat eaters. Soaking, sprouting and sourdough fermentation break phytate down and improve both zinc and iron. Selenium depends heavily on local soils; whole grains, pulses and eggs contribute."},
{h:"Protein",b:"Rarely a real problem. About 0.8 g per kg of body weight is the adult reference, rising to about 1.0 after 65 and higher with heavy training. Pulses and grains complement each other, and they don't have to be in the same meal — across the day is fine."},
{h:"The cheese trap",b:"The most common beginner's mistake is replacing meat with cheese and ready meals. It gains you little on health, little on climate — cheese is among the heaviest non-meat foods per kilo — and nothing at all on money. Pulses are the core of a vegetarian diet, not the side dish."},
{h:"If you're pregnant, young, older or training hard",b:"Requirements differ meaningfully for pregnancy and breastfeeding, for children and teenagers, for older adults and for serious athletes. A well-planned vegetarian diet works in all of these cases, but the margins are thinner. Worth one conversation with a professional rather than guesswork."}
],
caveats:[
{h:"Why we don't write “saved”",b:"Less demand lowers production, but not one for one. Agricultural economics puts it at roughly 0.7 fewer animals produced per animal not bought — the rest is absorbed by price and substitution effects. Clearly below one, clearly above zero. It works, just not as arithmetic on individual animals. That's why this app says “animals you didn't eat”, not “animals saved”."},
{h:"Vegetarian is not animal-free",b:"If you still eat eggs and dairy, animals stay in the picture. Laying hens are slaughtered after roughly 18 months; dairy cows only give milk because they calve, and their male calves go to veal or beef. Your animal counter measures what you didn't eat. It does not claim nobody is affected any more."},
{h:"What the water number doesn't say",b:"This app counts freshwater withdrawal — water actually taken from rivers, lakes and groundwater. That's deliberate. The famous “15,000 litres per kilo of beef” figure is mostly green water: rain that would have fallen on that pasture anyway. Counting withdrawals reorders everything: beef falls below pork, and cheese and nuts rise above all meat. It also means a litre in Andalusia and a litre in Ireland count the same here, which is wrong in every way that matters locally. Water scarcity is regional; a global average can't express that."},
{h:"Cheese is not a meat substitute",b:"Per kilogram of protein-matched replacement, cheese carries about 29 kg CO₂e and by far the highest freshwater withdrawal and land use of anything in this app. Replace beef with cheese and you still gain a lot. Replace pork or chicken with cheese and your climate tile can legitimately show zero or a negative number. That's the arithmetic, not a bug."},
{h:"Intervention or observation?",b:"Two kinds of study sit behind these numbers and they say very different things. Intervention trials assign a diet and measure before and after — blood pressure, blood lipids and TMAO come from these, and they support causal reading. Cohort studies compare groups of people who already differed — every long-term finding on heart disease, cancer and mortality comes from these. They say people who eat this way have less X. Not: if you eat this way you will get less X."},
{h:"Healthy-user bias — the number that relativises the rest",b:"In EPIC-Oxford, the standardised mortality of the entire cohort was about half the national rate — identical for vegetarians and meat eaters. People who volunteer for nutrition cohorts smoke less, move more, are better educated and see doctors more often. An unknown but certainly meaningful share of every flattering cohort figure belongs to those habits, not to the food. It doesn't invalidate the studies; it limits what you can take from them personally."},
{h:"What this app knows about itself",b:"In the Cochrane review of smoking cessation, automated text messages worked clearly; apps as such showed no measurable effect at very low certainty of evidence. What did work was self-monitoring and if-then planning, not points and badges. And quitting smoking is binary, while eating is not: several times a day, social, with no sensible zero point. We know of no randomised trial of a meat-reduction app with measured long-term outcomes. This app is a well-reasoned bet, not a proven method."},
{h:"The fish numbers are the shakiest here",b:"Average weight per fish in a typical diet can only be estimated: between a herring and a farmed salmon lies a factor of twenty-five. We use a mid-range figure and say so. Bycatch is included in the animal count at roughly a tenth of landed weight, which adds proportionally more individuals because those animals are smaller. Not counted: the wild fish ground into feed for farmed salmon and shrimp — a large number we can't pin down credibly. And the carbon figure says nothing about overfishing or seabed damage, which are the actual ecological problems with fish."},
{h:"Global averages hide a lot",b:"Every environmental number here is a global median from one dataset. Real footprints vary enormously — beef from a deforested pasture and beef from a dairy herd differ by roughly a factor of three, and the same is true across regions and farming systems. Your own shopping basket is not the median. Treat these tiles as orders of magnitude, not measurements, and treat the direction as much more reliable than the size."},
{h:"Numbers we deliberately don't use",b:"“About 1,100 animals per human lifetime” — the individual components can't be reproduced with current data. “Processed meat is in the same category as tobacco” — formally true and thoroughly misleading, since the IARC group describes how certain a link is, not how large the risk is. “21 days makes a habit” — appears in no study. “You've offset X trees” — single-tree figures vary by a factor of five, and several major forests have recently flipped to net carbon sources. “You'll live X days longer” — there is no sound basis for it."},
{h:"Why nothing here resets to zero",b:"In the best-known habit study, a single missed occasion lowered automaticity by less than half a scale point and was quickly recovered. Addiction research adds the idea that it isn't the lapse that ends the attempt, it's the judgement afterwards — though that was tested on smokers and restrained eaters, not on people eating less meat. We still think the smaller risk is to never let a counter drop to zero. That's a design decision, not a study result."},
{h:"The small print",b:"This app gives no medical or dietary advice, makes no diagnoses, states no dosages and calculates no personal risk. If you take blood pressure or diabetes medication, a diet change can move your numbers — a reason to involve your doctor, not a reason to skip it, and never a reason to adjust medication yourself. Every figure here is an estimate built on averages: your own entry, production statistics and life-cycle assessments. If thinking about food starts to feel compulsive or frightening, that can be a warning sign — this app shows no calories and no body weight, and stepping away from it is always allowed."}
]
};

  eq:(c,f)=>c.water < 0 ? "Negativ — dein Ersatz entnimmt mehr Süßwasser als das Fleisch. Käse und Nüsse sind hier die Ausreißer."
    : "Rund "+f.n0(f.tubs)+" volle Badewannen. Gezählt wird Wasser, das wirklich aus Flüssen und Grundwasser entnommen wird, nicht Regen." },
area:{ k:"Ackerfläche, die nicht gebraucht wurde",
  eq:(c,f)=>{ if(c.area < 0) return "Negativ — dein Ersatz braucht mehr Fläche. Bei viel Käse ist das der Normalfall, nicht die Ausnahme.";
    return (f.pitches < 1 ? "Etwa "+f.n0(f.spots)+" Parkplätze." : "Etwa "+f.n1(f.pitches)+" Fußballfelder.")
      + " Fast alles davon geht auf Rind zurück."; } },
money:{ k:"Geld, das du nicht ausgegeben hast",
  eq:(c,f)=>c.money < 0 ? "Ein Minus — dein Ersatz kostet derzeit mehr als das Fleisch. Käse und Nüsse sind meist der Grund. Setz unter „Du“ deine eigenen Preise, wenn unsere nicht zu deinem Laden passen."
    : "Etwa "+f.n0(c.money/10)+" Kinobesuche." },
days:{ k:"Fleischfreie Tage insgesamt", unit:"Tage",
  eq:(c,f)=>"Diese Zahl sinkt nie. In der bekanntesten Gewohnheitsstudie lag der Median bei 66 Tagen — Spanne 18 bis über 250." }
},
sources:{
animals:{ h:"Wie viele Tiere?",
  value:"Verzehrbares Fleisch ohne Knochen je Tier: Masthuhn 1,2 kg, Pute 7,5 kg, Schwein 57 kg, Rind 150 kg. Fisch: etwa 0,9 Individuen je Kilo Anlandung, und 2,4 kg Anlandung je Kilo, das du isst.",
  origin:"FAO-Produktions- und Schlachtstatistik; Beifanganteil nach Pérez Roda et al. 2019 (FAO), die den weltweiten Rückwurf auf rund ein Zehntel der Anlandungen beziffern.",
  method:"Alle vier Arten nutzen dieselbe Gewichtsbasis — verzehrbar und ohne Knochen, weil du genau das eingibst. Schlachtgewichte liegen etwa 1,6-mal höher und werden bewusst nicht verwendet. Geflügel wird 88 % Huhn und 12 % Pute aufgeteilt. Beifang kommt mit 10 % des Anlandegewichts dazu und wird mit mehr Individuen je Kilo gezählt, weil die Tiere kleiner sind. Seine Emissionen und sein Wasser werden nicht zusätzlich addiert — sie stecken schon in den Fischerei-Ökobilanzen.",
  limit:"Das ist ein bilanzieller Durchschnitt, keine Zuordnung konkreter Tiere: Er sagt, wie vielen Tieren deine Menge entspricht, wenn alle Teile eines Tieres irgendwo gegessen werden. Und weniger Nachfrage senkt die Produktion nicht eins zu eins — Schätzungen liegen bei etwa 0,7.",
  formula:"Tiere = kg Huhn    ÷ 1,2\n      + kg Pute    ÷ 7,5\n      + kg Schwein ÷ 57\n      + kg Rind    ÷ 150\n      + Anlandung × 0,9\n      + Anlandung × 0,10 × 3,0   (Beifang)" },
weight:{ h:"Wie viel Fleisch?",
  value:"Deine eigene Angabe, hochgerechnet auf die Zeit seit deinem Startdatum.",
  origin:"Die Voreinstellungen stammen aus nationalen Versorgungsbilanzen: rund 100 kg Fleisch pro Kopf und Jahr in den USA, 55 kg in Deutschland, 43 kg im Weltdurchschnitt.",
  method:"Konstanter früherer Konsum, Rohgewicht. Eingetragene Fleisch- und Fischtage werden von der jeweiligen Art abgezogen.",
  limit:"Steht und fällt mit deiner Schätzung. Achtung bei fremden Zahlen: Schlachtgewichtsstatistiken enthalten Knochen und Verluste und liegen weit über dem, was tatsächlich gegessen wird.",
  formula:"kg = Gramm pro Woche ÷ 1000 × Wochen\n     − eingetragene Fleischtage" },
co2:{ h:"Wie viel CO₂?",
  value:"An gemessenen Ernährungsweisen verankert: Der Wechsel von viel Fleisch (über 100 g am Tag) zu vegetarisch macht 6,43 kg CO₂e pro Tag aus. Kleinere Fleischmengen skalieren herunter — 3,74 bei 75 g am Tag, 1,56 bei 25 g.",
  origin:"Scarborough et al. 2023, Nature Food — die tatsächlichen Ernährungsweisen von rund 55.000 Menschen in Großbritannien, gemessen statt modelliert. Die Kilogrammwerte, mit denen deine konkrete Fleischmischung gewichtet wird, stammen aus Poore & Nemecek 2018, Science.",
  method:"Die gemessene Kurve setzt das Niveau; deine Fleischzusammensetzung und dein Ersatz skalieren es darum herum — die Ersatzmischung bewegt diese Zahl also weiterhin. Ab 150 g Fleisch am Tag bleibt der Wert konstant: Das ist der Mittelwert der höchsten tatsächlich gemessenen Gruppe, und darüber hinaus zu extrapolieren würde bald mehr Ersparnis behaupten, als der gesamte Fleischesser-Speiseplan wiegt.",
  limit:"Das ist ein Beobachtungsvergleich zwischen Menschengruppen, keine Vorher-Nachher-Messung bei dir. Vegetarier unterscheiden sich in mehr als nur Fleisch, ein Teil dieser Differenz gehört also zum Rest ihrer Ernährung und ihren Gewohnheiten — lies sie als oberes Ende dessen, was die Umstellung wert ist, zusammen mit „Healthy-User-Bias“ unter Einwände. Eine Bottom-up-Rechnung, die nur den Tausch zählt, kommt auf etwa ein Drittel davon; die Wahrheit liegt dazwischen. Der Prozentwert vergleicht deine auf ein Jahr hochgerechnete Rate mit dem durchschnittlichen konsumbasierten Fußabdruck deiner Region — 14 t für die USA, 10,3 t für Deutschland, 4,7 t weltweit — also mit dem Gesamtwert einer durchschnittlichen Person, nicht mit deinem. Am Anfang ist es zudem eine Hochrechnung aus wenigen Wochen, keine Messung.",
  formula:"pro Tag = gemessene Differenz bei deiner Fleischmenge\nCO₂e    = pro Tag × Tage\n          × (dein Netto je kg ÷ Referenz je kg)" },
water:{ h:"Welches Wasser?",
  value:"Süßwasserentnahme je Kilogramm: Rind 2.080, Schwein 1.796, Fisch 1.850, Geflügel 660 Liter. Käse ist mit 6.726 je ersetztem Kilo Fleisch die höchste Zahl dieser App.",
  origin:"Poore & Nemecek 2018 — derselbe Datensatz wie bei Klima und Fläche, damit Fleisch und Ersatz immer gleich gemessen werden.",
  method:"Netto gegen deine Ersatzmischung, proteinbezogen.",
  limit:"Entnahme ist die knappe Art von Wasser, weshalb diese Zahlen weit unter den bekannten „15.000 Liter je Kilo Rind“ liegen — jene Zahl ist überwiegend Regen. Die Kehrseite: Ein Liter in einer trockenen und einer feuchten Region zählt hier gleich, und das ist in jeder Hinsicht falsch, die vor Ort zählt. Anders als die Klima-Kachel ist diese hier weiterhin eine Bottom-up-Tauschrechnung und nicht an gemessene Ernährungsweisen gekoppelt — also die engere der beiden Schätzarten.",
  formula:"Liter = Σ kg[Art] × (Wasser[Art] − Wasser[Ersatz])" },
area:{ h:"Welche Fläche?",
  value:"Flächenbedarf je Kilogramm und Jahr: Rind 185, Schwein 17,4, Geflügel 12,2 m². Käse liegt bei rund 105 je ersetztem Kilo Fleisch.",
  origin:"Poore & Nemecek 2018.",
  method:"Netto gegen deine Ersatzmischung. Die Einheit ist Quadratmeter mal Jahr: eine Fläche, die ein Jahr lang belegt wird.",
  limit:"Ein großer Teil der Rinderfläche ist Weideland, auf dem kein Ackerbau möglich wäre. Die Zahl sagt also nicht, dass dort Getreide für Menschen wachsen könnte. Sie wird außerdem von Rind dominiert — bei Schwein und Geflügel bleibt nach Abzug des Ersatzes wenig übrig. Wie beim Wasser und anders als beim Klima ist das eine Bottom-up-Tauschrechnung, nicht an gemessene Ernährungsweisen gekoppelt.",
  formula:"m²·Jahr = Σ kg[Art] × (Fläche[Art] − Fläche[Ersatz])" },
money:{ h:"Woher der Betrag kommt",
  value:"Regionale Durchschnittspreise je Kilogramm — jeden einzelnen kannst du unter „Du“ überschreiben.",
  origin:"Nationale Preiserhebungen, für die Ersatzwerte zusätzlich das Preis-Tracking von GFI Europe aus dem ersten Quartal 2026. Die Ersatzkosten sind unsere eigene Rechnung auf Proteinbasis.",
  method:"Die Kosten deiner Ersatzmischung werden vom nicht gekauften Fleisch abgezogen. Der Faktor 0,72 berücksichtigt, dass Kantine und Restaurant im Basiswert nicht enthalten sind.",
  limit:"Das sind die schnellsten Zahlen der App und die, die bei dir am ehesten danebenliegen. Der jahrelange Aufschlag auf Fleischersatz ist deutlich geschrumpft: Beim größten britischen Händler lag pflanzliches Hack Anfang 2026 29 % unter Rinderhack, fleischfreie Bällchen 41 % darunter — auch weil Rindfleisch selbst über 10 % im Jahresvergleich teurer wurde. Es bleibt aber unterschiedlich nach Markt, Händler und Produkt: Rinder-Burgerpatties blieben günstiger als pflanzliche, und in manchen Ländern liegt Ersatz weiter über rabattiertem Schweinefleisch. Nimm unsere Vorgaben als Mittelwert und ersetz sie durch deine.",
  formula:"Geld = (Σ kg[Art] × Preis[Art]\n       − kg gesamt × Preis[Ersatz]) × 0,72" },
days:{ h:"Was hier gezählt wird",
  value:"Jeder Tag, den du als rein pflanzlich oder mit Ei und Milch eingetragen hast.",
  origin:"Deine eigenen Einträge.",
  method:"Tage ohne Eintrag zählen als unbekannt und senken nichts. Fisch- und Fleischtage zählen hier nicht mit, ziehen aber auch nichts ab.",
  limit:"Diese Zahl sinkt konstruktionsbedingt nie. Sie belohnt Selbstbeobachtung, nicht Perfektion.",
  formula:"Tage = Anzahl Einträge vom Typ\n       pflanzlich oder Ei und Milch" }
},
milestones:[
{d:1,k:"body",t:"Dein Darm reagiert als Erstes",b:"Die Darmflora verschiebt sich messbar, etwa einen Tag nachdem die neue Kost den Dickdarm erreicht. Kleine Studie, extreme Kostformen — was sie zeigt, ist die Geschwindigkeit, nicht die Größe des Nutzens.",q:"David et al. 2014, Nature — kontrollierte Studie, n=10"},
{d:1,k:"habit",t:"Zwei Handgriffe für heute",b:"Etwas mit Vitamin C zu eisenreichen Mahlzeiten — Zitrone auf Linsen, Paprika zum Getreide. Und Kaffee oder Tee eine halbe Stunde nach dem Essen statt dazu.",q:"Resorptionsstudien zu Eisen; nationale Ernährungsempfehlungen"},
{d:2,k:"habit",t:"Tag zwei ist der, der zählt",b:"Tag eins ist eine Entscheidung. Tag zwei ist der Punkt, an dem es anfängt, etwas zu werden, das du tust. Heute gibt es nichts zu optimieren — mach es einfach nochmal.",q:"Deine eigenen Zahlen"},
{d:5,k:"habit",t:"Dein Einkauf hat sich schon geändert",b:"Nach fünf Tagen sieht der Wagen anders aus, bevor du darüber nachdenkst. Genau diese Verschiebung im Routinekauf überlebt die Motivation, und darum geht es.",q:"Gewohnheitsforschung; Lally et al. 2010"},
{d:7,k:"animals",t:"Erste Woche",b:"Eine Woche ohne Fleisch. Zur Einordnung: Die meisten nationalen Empfehlungen liegen bei deutlich weniger als der Hälfte dessen, was in reichen Ländern tatsächlich gegessen wird — du warst gerade sieben Tage unter jeder einzelnen davon.",q:"FAO-Versorgungsbilanzen; WHO und nationale Empfehlungen"},
{d:10,k:"animals",t:"Zehn Tage",b:"Genug, dass die Zähler etwas zu zeigen haben. Tipp auf eine beliebige Zahl, dann siehst du, woher sie kommt — die Quellen sind der Punkt dieser App, keine Deko.",q:"Deine eigenen Zahlen"},
{d:14,k:"habit",t:"Hülsenfrüchte zur Routine machen",b:"Das ist der Umbau, der alles andere trägt: Linsen, Kichererbsen, Bohnen. Eisen, Zink und Protein in einem Topf. Steigere langsam, wenn der Bauch am Anfang protestiert.",q:"EFSA-Referenzwerte"},
{d:14,k:"body",t:"Blutdruck: klein und gut belegt",b:"Über sieben kontrollierte Studien gepoolt senkte vegetarische Kost den oberen Wert um etwa 4,8 mmHg und den unteren um 2,2. Wenn du Blutdrucksenker nimmst, mach die Umstellung mit deiner Ärztin.",q:"Yokoyama et al. 2014, JAMA Internal Medicine — 7 kontrollierte Studien, n=311"},
{d:21,k:"habit",t:"Eine Handvoll Nüsse, täglich",b:"Rund 25 g Nüsse oder Samen am Tag sind ohnehin Standardempfehlung und jetzt doppelt nützlich für Zink und Magnesium. Walnüsse bringen pflanzliches Omega-3 mit, Kürbis- und Sonnenblumenkerne sind die günstigen Zink-Helden.",q:"Nationale Ernährungsempfehlungen; PREDIMED-Studie"},
{d:28,k:"body",t:"TMAO fällt",b:"TMAO entsteht, wenn Darmbakterien Carnitin aus rotem Fleisch verstoffwechseln. In einer randomisierten Fütterungsstudie lag es unter rotem Fleisch mehr als doppelt so hoch und war nach vier Wochen Karenz wieder unten.",q:"Wang, Bergeron et al. 2019, Eur Heart J — randomisiertes Crossover, n=113"},
{d:30,k:"money",t:"Erster Monat",b:"Was hier steht, hängt fast vollständig daran, was das Fleisch ersetzt hat. Selbst gekochte Hülsenfrüchte sparen am meisten, Käse am wenigsten. Ersatzprodukte hatten lange einen hohen Aufschlag, der ist stark geschrumpft und hat sich in manchen Märkten umgedreht. Passen unsere Preise nicht zu deinen Kassenbons, überschreib sie unter „Du“.",q:"GFI Europe Preis-Tracking Q1 2026; nationale Preiserhebungen"},
{d:40,at:{m:"chicken",v:1},k:"animals",t:"Dein erstes ganzes Masthuhn",b:"Ein Masthuhn liefert rund 1,2 kg verzehrbares Fleisch — hier landet also das erste ganze Tier. Masthühner werden nach fünf bis sieben Wochen geschlachtet; Hühner könnten mehrere Jahre alt werden.",q:"FAO-Produktionsstatistik; nationale Schlachtdaten"},
{d:42,k:"body",t:"Blutfette — die beste Evidenz hier",b:"Über elf kontrollierte Studien senkte vegetarische Kost das LDL um rund 13 mg/dl und das Non-HDL um etwa 12. Das HDL sank leicht mit. Wer Fleisch durch viel Käse ersetzt, verschenkt den größten Teil davon.",q:"Wang et al. 2015, J Am Heart Assoc — Meta-Analyse, 11 kontrollierte Studien"},
{d:45,k:"habit",t:"Omega-3 ohne Fisch",b:"Leinsamen und Walnüsse decken ALA locker, aber die Umwandlung in die langkettigen EPA und DHA ist schlecht und schwankt stark zwischen Personen. Algenöl ist die einzige direkte Quelle, die bleibt.",q:"EFSA-Zufuhrempfehlung; Isotopenstudien zur ALA-Konversion"},
{d:50,k:"money",t:"Fünfzig Tage",b:"Lang genug, dass die Geld-Kachel kein Rauschen mehr ist. Wenn sie kleiner ausfällt als erwartet, schau nach, welchen Ersatz du gewählt hast — diese eine Einstellung bewegt die Zahl stärker als alles andere.",q:"Deine eigenen Zahlen"},
{d:60,k:"habit",t:"Protein-Realitätscheck",b:"Du liegst mit hoher Wahrscheinlichkeit richtig. Rund 0,8 g pro Kilo Körpergewicht sind der Referenzwert; Linsen, Tofu, Haferflocken, Eier und Milchprodukte kommen mühelos dahin. Die alte Regel, Proteine in einer Mahlzeit zu kombinieren, gilt als überholt.",q:"EFSA- und WHO/FAO-Referenzwerte für Protein"},
{d:66,k:"habit",t:"66 Tage, nicht 21",b:"In der bekanntesten Gewohnheitsstudie lag der Median bei 66 Tagen, bis sich eine neue Routine automatisch anfühlte, mit einer Spanne von 18 bis über 250. Die populären 21 Tage stehen in keiner Studie. Länger zu brauchen ist normal.",q:"Lally et al. 2010, Eur J Soc Psychol"},
{d:75,k:"body",t:"Dein Geschmack kalibriert sich neu",b:"Geschmack passt sich an. Ändert sich die Zufuhr, verschieben sich die Wahrnehmungsschwellen für Salz und Fett binnen Wochen — Gemüse, das im ersten Monat fad wirkte, schmeckt plötzlich süß. Nichts Mystisches, nur Rezeptoren.",q:"Studien zur sensorischen Adaptation (Bertino et al. 1982; Mattes 1993)"},
{d:90,k:"body",t:"Dein erster aussagekräftiger HbA1c",b:"Der HbA1c bildet die letzten zwei bis drei Monate ab — erst jetzt beschreibt ein Wert deine neue Ernährung. Bei Menschen mit Typ-2-Diabetes senkte vegetarische Kost ihn um etwa 0,4 Punkte.",q:"Yokoyama et al. 2014, Cardiovasc Diagn Ther — nur Typ-2-Diabetes"},
{d:90,k:"habit",t:"Das Fertigprodukt-Audit",b:"Fleischersatz ist ein guter Einstieg, und der alte Einwand dagegen hat sich weitgehend aufgelöst: Anfang 2026 lag pflanzliches Hack beim größten britischen Händler rund ein Drittel unter Rinderhack. Geblieben ist die Verarbeitung — Salz vergleichbar mit Fleisch, gesättigte Fette deutlich niedriger. Behalte, was dir wirklich schmeckt, und koch den Rest aus Bohnen und Tofu.",q:"GFI Europe Preis-Tracking Q1 2026 (Tesco, 33 Produkte); Marktchecks von Verbraucherorganisationen"},
{d:100,k:"habit",t:"Einhundert Tage",b:"Drei Stellen. Jenseits des Medians, ab dem eine Routine automatisch wird, und jenseits des Punktes, an dem die meisten so etwas still wieder aufgeben. Das darf man jemandem erzählen.",q:"Lally et al. 2010 — Median 66 Tage"},
{d:115,at:{m:"money",v:100},k:"money",t:"Die ersten hundert",b:"Rund zehn Kinobesuche. Der größte Hebel beim Sparen hat wenig mit Vegetarismus zu tun: selbst kochen statt fertig kaufen.",q:"Eigene Modellrechnung aus Handelspreisen"},
{d:120,k:"habit",t:"Zink und Selen im Blick",b:"Phytat aus Vollkorn und Hülsenfrüchten bindet Zink, deshalb liegt der Bedarf höher. Einweichen, Keimen und Sauerteig bauen Phytat ab. Paranüsse sind selenreich, aber unberechenbar dosiert — nicht als tägliche Portion.",q:"EFSA-Referenzwerte (phytatabhängig)"},
{d:126,k:"body",t:"Die Waage: Rückenwind, keine Zusage",b:"In randomisierten Studien lagen vegetarische Teilnehmende nach rund 18 Wochen ein bis zwei Kilo unter der Vergleichsgruppe — und für lakto-ovo-vegetarische Kost war das Ergebnis statistisch nicht gesichert. Käse und Nudeln zählen weiter.",q:"Huang et al. 2016, J Gen Intern Med — 12 RCTs, n=1151"},
{d:150,k:"planet",t:"Du hast eine echte Zahl bewegt",b:"Die Klima-Kachel ist jetzt groß genug für einen Vergleich, den man kennt: eine lange Autofahrt, ein Kurzstreckenflug, eine Woche Heizung. Klein gegen das Gesamte, und trotzdem tatsächlich deins.",q:"Poore & Nemecek 2018, Science"},
{d:159,at:{m:"co2",v:100},k:"planet",t:"Hundert Kilogramm CO₂e",b:"Rund 480 km mit einem durchschnittlichen Auto. Die ehrliche Spanne ist breit — sie hängt an der Datenbasis und daran, was stattdessen auf dem Teller lag.",q:"Poore & Nemecek 2018; IEA-Flottenemissionsfaktoren"},
{d:180,k:"habit",t:"Ein halbes Jahr — Zeit für Blutwerte",b:"Kleines Blutbild und Ferritin, am besten mit CRP, weil Entzündungen den Ferritinwert hochtreiben. Sag beim Termin, dass du vegetarisch isst; das ändert, worauf geschaut wird. Keine Leitlinie schreibt dieses Intervall vor — es ist Praxis, kein Gesetz.",q:"WHO-Ferritin-Leitlinie 2020; Intervall ist Konvention"},
{d:202,at:{m:"chicken",v:5},k:"animals",t:"Fünf Masthühner",b:"Fast alles Geflügel, und genau darum geht es in diesem Kapitel: Geflügel ist ein Viertel des Gewichts, aber neun von zehn Tieren. Beim Rind stecken die Kilos, beim Huhn die Tiere.",q:"FAO-Produktionsstatistik; eigene Rechnung"},
{d:250,k:"animals",t:"Du hast aufgehört mitzuzählen",b:"Irgendwo hier hören Menschen auf, das als Projekt zu behandeln, und fangen an, es als Tatsache über sich zu behandeln. Diese Verschiebung — von dem, was du tust, zu dem, was du bist — sagt am besten voraus, ob es bleibt.",q:"Forschung zu identitätsbasierten Gewohnheiten"},
{d:270,k:"habit",t:"Rund achthundert Mahlzeiten",b:"Ungefähr so viele hast du seit dem Start gegessen. Die meisten davon waren unauffällig, und das ist das bestmögliche Ergebnis: Es hat aufgehört, eine Entscheidung zu sein, und ist Mittagessen geworden.",q:"Deine eigenen Zahlen"},
{d:300,k:"animals",t:"Die Fische, die niemand sieht",b:"Rund ein Zehntel dessen, was Fangflotten anlanden, ist Beifang — gefangen und wieder über Bord geworfen. Weil diese Tiere kleiner sind, bringen sie pro Kilo mehr Individuen als die Fische, die du isst. Dein Zähler hat sie drin.",q:"Pérez Roda et al. 2019, FAO — globale Rückwurfschätzung"},
{d:365,k:"planet",t:"Ein Jahr Klimabilanz",b:"Ein realer, gut belegter Beitrag — und ein größerer, als die meisten erwarten. Über Zehntausende gemessene Ernährungsweisen hinweg gehört der Verzicht auf Fleisch zu den größten Einzelhebeln eines Haushalts: Wer vorher viel Fleisch aß, kommt auf grob zwei Tonnen CO₂e im Jahr, etwa ein Langstrecken-Hin-und-Rückflug. Strom, Heizung und Verkehr bleiben davon unberührt — und es bleibt ein Vergleich zwischen Menschengruppen, keine Messung an dir.",q:"Poore & Nemecek 2018; Scarborough et al. 2023, Nature Food; nationale konsumbasierte Fußabdruckdaten"},
{d:365,k:"money",t:"Ein Jahr Geld",b:"Wer Fleisch überwiegend durch Hülsenfrüchte, Getreide und Gemüse ersetzt, spart über ein Jahr echtes Geld. Wer es durch Käse ersetzt, spart wenig. Deine Kassenbons schlagen unsere Schätzung — passe die Preise unter „Du“ an.",q:"Eigene Modellrechnung aus Preiserhebungen"},
{d:365,k:"body",t:"Ein Jahr — und jetzt der ehrliche Teil",b:"Lass einmal B12, Ferritin und Vitamin D prüfen. Lakto-ovo-Vegetarier liegen im Schnitt niedriger bei B12 und bei den Eisenspeichern als Fleischesser; beides ist gut zu handhaben, aber nur, wenn du davon weißt.",q:"Gilsing et al. 2010, Eur J Clin Nutr; Haider et al. 2018"},
{d:400,k:"habit",t:"Du bist inzwischen jemandes Beispiel",b:"Nach einem Jahr fragt im Umfeld niemand mehr, ob das eine Phase ist. Du musst für nichts argumentieren — das Überzeugendste, was dir zur Verfügung steht, ist gut zu essen und es niemandem zum Problem zu machen.",q:"Forschung zu sozialen Normen; Sparkman & Walton 2017"},
{d:500,k:"planet",t:"Fünfhundert Tage",b:"Lang genug, dass die Jahresrate zählt und nicht die Gesamtsumme. Was auch immer deine Zahl pro Jahr ist — sie wiederholt sich jetzt, ohne dass du daran denkst. Genau das macht Ernährungsänderungen mehr wert als einmalige Gesten.",q:"Poore & Nemecek 2018"},
{d:548,k:"animals",t:"Achtzehn Monate",b:"Anderthalb Jahre. Der Tierzähler wird von Geflügel dominiert — das heißt, angetrieben wird er vom unauffälligsten Posten der Speisekarte, nicht vom Steak, über das alle streiten.",q:"FAO-Produktionsstatistik; eigene Rechnung"},
{d:730,k:"animals",t:"Zwei Jahre — und was sich nicht ändert",b:"Rund zwanzig Landtiere, ganz überwiegend Masthühner. Der Teil, den wir nicht weglassen: Eier und Milch halten Legehennen und Milchkühe im Bild, und beide werden am Ende geschlachtet. Vegetarisch ist nicht tierfrei.",q:"FAO-Produktionsstatistik; Daten zur Legeleistung"},
{d:981,at:{m:"pig",v:1},k:"animals",t:"Ein ganzes Mastschwein",b:"Rund 57 kg Schweinefleisch — die verzehrbare Ausbeute ohne Knochen eines Schweins, das etwa ein halbes Jahr lebt. Schwein ist weltweit das meistgegessene Fleisch nach Gewicht, trägt pro Kilo aber nur etwa ein Fünftel der Klimalast von Rind.",q:"FAO-Produktionsstatistik; Poore & Nemecek 2018"},
{d:1079,at:{m:"co2",v:500},k:"planet",t:"Ein Langstreckenflug",b:"Rund 500 kg CO₂e — etwa ein langer Hin- und Rückflug, inklusive der zusätzlichen Wirkung in großer Höhe. Je nach Methode wird derselbe Flug zwischen der Hälfte und dem Doppelten davon berechnet.",q:"Poore & Nemecek 2018; Flugemissionsrechner"},
{d:1095,k:"habit",t:"Drei Jahre",b:"An diesem Punkt ist die interessante Frage nicht mehr, ob du weitermachst. Sondern dass du still ein Repertoire aufgebaut hast — ein Dutzend Gerichte, die du ohne Nachschlagen kannst. Dieses Repertoire ist die eigentliche Infrastruktur hier.",q:"Deine eigenen Zahlen"},
{d:1500,k:"planet",t:"Vier Jahre, kumulierend",b:"An diesem Punkt passiert nichts Dramatisches, und genau das ist der Befund. Der Wert einer Ernährungsänderung liegt darin, dass sie jeden Tag anfällt, ohne weitere Entscheidungen — das Gegenteil davon, wie die meisten Umweltanstrengungen funktionieren.",q:"Poore & Nemecek 2018"},
{d:1825,k:"body",t:"Fünf Jahre — hier bewusst keine Zahl",b:"Viele Apps rechnen gewonnene Lebenstage vor. Wir können das nicht: Die großen Kohorten widersprechen sich. Eine fand Vegetarier bei der Gesamtsterblichkeit leicht niedriger, eine andere gar keinen Unterschied. Am aufschlussreichsten ist, dass beide Kohorten insgesamt bei etwa der Hälfte der landesüblichen Sterblichkeit lagen — Vegetarier und Fleischesser gleichermaßen.",q:"Orlich et al. 2013, JAMA Intern Med; Key et al. 2009, Am J Clin Nutr"},
{d:2190,k:"habit",t:"Sechs Jahre",b:"Lang genug, dass du jede unangenehme Situation durchgespielt hast, die das erzeugt — die Hochzeit, die Dienstreise, den Verwandten, der es persönlich nimmt — und für jede einen Weg gefunden hast. Das ist keine Willenskraft mehr, das ist Erfahrung.",q:"Deine eigenen Zahlen"},
{d:2555,k:"body",t:"Darmkrebs — zwei Antworten",b:"Verarbeitetes Fleisch ist in IARC-Gruppe 1: Der Zusammenhang mit Darmkrebs gilt als gesichert, wobei die Gruppe nichts über die Größe des Risikos sagt. Die beiden großen Kohorten widersprechen sich dann bei Vegetariern. Das sagen wir dir lieber, als eine Seite zu wählen.",q:"IARC/WHO 2015; Orlich et al. 2015; Key et al. 2009"},
{d:2920,k:"animals",t:"Acht Jahre",b:"Genug, dass die Summe keine Abstraktion mehr ist. Wie genau die Zahl auch ausfällt, die Richtung stand nie infrage — und anders als fast alles andere in dieser App braucht dieser Zähler keine Annahmen über irgendjemanden außer dir.",q:"FAO-Produktionsstatistik; eigene Rechnung"},
{d:3650,k:"body",t:"Zehn Jahre: der stabilste Langzeitbefund",b:"In EPIC-Oxford traten bei Vegetariern über zehn Jahre etwa zehn Fälle koronarer Herzkrankheit weniger pro tausend Menschen auf. Eine Meta-Analyse über acht Kohorten bestätigt die Richtung und stuft sie als wahrscheinlich ein. Es sind Beobachtungsdaten — ein Vergleich zwischen Gruppen, keine Vorher-Nachher-Messung bei dir.",q:"Tong et al. 2019, BMJ; Dybvik et al. 2023, Eur J Nutr (RR 0,79)"},
{d:4200,k:"body",t:"Ein unterschätzter Gewinn: Divertikelkrankheit",b:"Darüber spricht kaum jemand, dabei bringt sie viele Menschen ins Krankenhaus. In EPIC-Oxford hatten Vegetarier über 11,6 Jahre ein um rund ein Drittel niedrigeres Risiko, deswegen eingewiesen zu werden, wobei Ballaststoffe unabhängig davon zusätzlich halfen.",q:"Crowe et al. 2011, BMJ — EPIC-Oxford, n=47.033"},
{d:5475,k:"habit",t:"Fünfzehn Jahre",b:"Die meisten Dinge, die Menschen anfangen, laufen nicht so lange. In dieser Größenordnung bedeutet kein Abzeichen mehr viel — aber wenn du damit angefangen hast in der Hoffnung, dass es unauffällig wird, dann ist es das, und das war immer die Siegbedingung.",q:"Deine eigenen Zahlen"},
{d:6570,k:"body",t:"Auch die unbequeme Zahl: Schlaganfall",b:"Dieselbe Studie, die zehn Fälle Herzkrankheit weniger zeigt, fand bei Vegetariern auch rund 20 Prozent mehr Schlaganfälle, überwiegend Hirnblutungen. Eine Meta-Analyse über zwölf Kohorten fand diesen Effekt nicht. Du liest das hier, damit du es nicht zuerst als Vorwurf hörst.",q:"Tong et al. 2019, BMJ (HR 1,20); Dybvik et al. 2023 (RR 0,90, n.s.)"},
{d:7300,k:"animals",t:"Zwanzig Jahre",b:"Ein paar hundert Landtiere, fast alles Masthühner. Ein ganzes Rind wirst du in dieser App vermutlich nie sehen — ein Tier liefert rund 150 kg Fleisch ohne Knochen, das dauert bei durchschnittlichem Verzehr an die fünfzehn Jahre. Beim Rind stecken die Kilos, beim Huhn die Tiere.",q:"FAO-Produktionsstatistik; eigene Rechnung"}
],

nutrition:[
{h:"Eisen",b:"Pflanzliches Eisen wird schlechter aufgenommen als Eisen aus Fleisch. Vitamin C in derselben Mahlzeit verbessert das deutlich, Kaffee und schwarzer Tee verschlechtern es. Gute Quellen: Hülsenfrüchte, Haferflocken, Kürbiskerne, Hirse. Die Referenzwerte liegen bei rund 16 mg am Tag für menstruierende Frauen und 11 mg für Männer. Lass Ferritin nach einem halben Jahr prüfen, am besten zusammen mit CRP, weil Entzündungen den Wert nach oben verfälschen."},
{h:"Vitamin B12",b:"Eier und Milchprodukte decken es meist, aber oft knapp: Lakto-ovo-Vegetarier liegen im Schnitt deutlich unter Fleischessern, und ein kleiner Teil liegt im Mangelbereich. Wenn du wenig Eier und Milch isst, lass Holo-Transcobalamin bestimmen statt nur Serum-B12 — das zeigt einen Mangel früher an."},
{h:"Jod",b:"Seefisch war eine der wichtigsten Quellen, und die fällt jetzt weg. Nimm jodiertes Speisesalz — das ist der einfachste Hebel. In Ländern mit Jodsalzprogrammen reicht das meist; wo es keine gibt, lohnt die Nachfrage. Algen sind wirksam, aber extrem schwankend dosiert."},
{h:"Omega-3",b:"Ohne Fisch fallen EPA und DHA weg. Leinsamen, Walnüsse und Rapsöl liefern ALA, aber der Körper wandelt davon nur wenige Prozent um, bei Männern noch weniger. Algenöl mit rund 250 mg EPA plus DHA am Tag ist die einzige direkte Quelle, die bleibt. Kein Muss — aber wenn du es nimmst, gehören die Kosten in deine Geld-Kachel."},
{h:"Zink und Selen",b:"Phytat aus Vollkorn und Hülsenfrüchten bindet Zink, deshalb liegt der Bedarf höher als bei Fleischessern. Einweichen, Keimen und Sauerteiggärung bauen Phytat ab und verbessern Zink und Eisen zugleich. Selen hängt stark von den Böden ab; Vollkorn, Hülsenfrüchte und Eier tragen bei."},
{h:"Protein",b:"Selten ein echtes Problem. Rund 0,8 g pro Kilo Körpergewicht sind der Referenzwert für Erwachsene, ab 65 etwa 1,0 und bei hartem Training mehr. Hülsenfrüchte und Getreide ergänzen sich, und das muss nicht in derselben Mahlzeit passieren — über den Tag verteilt genügt."},
{h:"Die Käse-Falle",b:"Der häufigste Anfängerfehler ist, Fleisch durch Käse und Fertiggerichte zu ersetzen. Das bringt gesundheitlich wenig, klimatisch wenig — Käse gehört pro Kilo zu den schwersten nicht-tierischen Posten überhaupt — und finanziell gar nichts. Hülsenfrüchte sind der Kern einer vegetarischen Ernährung, nicht die Beilage."},
{h:"Schwangerschaft, Kinder, höheres Alter, Leistungssport",b:"Für Schwangerschaft und Stillzeit, für Kinder und Jugendliche, für ältere Menschen und für ernsthaften Sport gelten deutlich andere Anforderungen. Eine gut geplante vegetarische Ernährung funktioniert in all diesen Fällen, aber die Spielräume sind kleiner. Dafür lohnt ein Gespräch mit einer Fachperson statt Raten."}
],
caveats:[
{h:"Warum wir nicht „gerettet“ schreiben",b:"Weniger Nachfrage senkt die Produktion, aber nicht eins zu eins. Die Agrarökonomie beziffert es auf grob 0,7 weniger produzierte Tiere je nicht gekauftem Tier — der Rest wird über Preis- und Substitutionseffekte aufgefangen. Deutlich unter eins, deutlich über null. Es wirkt, nur nicht als Rechnung mit einzelnen Tieren. Deshalb steht hier „Tiere, die du nicht gegessen hast“ und nicht „gerettete Tiere“."},
{h:"Vegetarisch ist nicht tierfrei",b:"Wer weiter Eier und Milch isst, hat weiter Tiere im Bild. Legehennen werden nach rund 18 Monaten geschlachtet; Milchkühe geben nur Milch, weil sie kalben, und ihre männlichen Kälber gehen in die Kalb- oder Rindermast. Dein Tierzähler misst, was du nicht gegessen hast. Er behauptet nicht, dass niemand mehr betroffen ist."},
{h:"Was die Wasserzahl nicht sagt",b:"Diese App zählt Süßwasserentnahme — Wasser, das tatsächlich aus Flüssen, Seen und Grundwasser entnommen wird. Das ist bewusst so. Die berühmten „15.000 Liter je Kilo Rind“ sind überwiegend grünes Wasser: Regen, der ohnehin auf diese Weide gefallen wäre. Die Entnahme zu zählen kehrt die Reihenfolge um: Rind fällt unter Schwein, und Käse und Nüsse steigen über jedes Fleisch. Es bedeutet aber auch, dass ein Liter in Andalusien und einer in Irland hier gleich zählen, und das ist in jeder Hinsicht falsch, die vor Ort zählt. Wasserknappheit ist regional; ein globaler Durchschnitt kann das nicht ausdrücken."},
{h:"Käse ist kein Fleischersatz",b:"Je Kilogramm proteinbezogenem Ersatz trägt Käse rund 29 kg CO₂e und die mit Abstand höchste Süßwasserentnahme und Flächennutzung von allem in dieser App. Ersetz Rind durch Käse, und du gewinnst trotzdem viel. Ersetz Schwein oder Huhn durch Käse, und deine Klima-Kachel darf zu Recht null oder eine negative Zahl zeigen. Das ist die Rechnung, kein Fehler."},
{h:"Intervention oder Beobachtung?",b:"Hinter diesen Zahlen stehen zwei Arten von Studien, und sie sagen etwas sehr Verschiedenes. Interventionsstudien geben eine Kost vor und messen vorher und nachher — daher stammen Blutdruck, Blutfette und TMAO, und sie erlauben kausale Deutung. Kohortenstudien vergleichen Gruppen, die sich schon vorher unterschieden — daher stammt jeder Langzeitbefund zu Herz, Krebs und Sterblichkeit. Die sagen: Menschen, die so essen, haben seltener X. Nicht: Wenn du so isst, bekommst du seltener X."},
{h:"Healthy-User-Bias — die Zahl, die alles relativiert",b:"In EPIC-Oxford lag die standardisierte Sterblichkeit der gesamten Kohorte bei etwa der Hälfte der landesüblichen Rate — bei Vegetariern und Fleischessern identisch. Wer sich freiwillig für Ernährungskohorten meldet, raucht weniger, bewegt sich mehr, ist gebildeter und geht häufiger zum Arzt. Ein unbekannter, aber sicher relevanter Teil jeder schmeichelhaften Kohortenzahl gehört diesen Gewohnheiten und nicht dem Essen. Das entwertet die Studien nicht, aber es begrenzt, was du für dich daraus mitnehmen kannst."},
{h:"Was diese App über sich selbst weiß",b:"In der Cochrane-Übersicht zum Rauchstopp wirkten automatisierte Textnachrichten deutlich; Apps als solche zeigten keinen messbaren Effekt bei sehr niedriger Evidenzsicherheit. Gewirkt haben Selbstbeobachtung und Wenn-Dann-Pläne, nicht Punkte und Abzeichen. Und Rauchstopp ist binär, Essen nicht: mehrmals täglich, sozial, ohne sinnvollen Nullpunkt. Uns ist keine randomisierte Studie zu einer Fleischreduktions-App mit gemessenen Langzeitendpunkten bekannt. Diese App ist eine gut begründete Wette, keine belegte Methode."},
{h:"Die Fischzahlen sind die wackligsten hier",b:"Das Durchschnittsgewicht eines Speisefisches lässt sich nur schätzen: Zwischen Hering und Zuchtlachs liegt Faktor 25. Wir nehmen einen mittleren Wert und sagen das dazu. Beifang steckt mit rund einem Zehntel des Anlandegewichts im Tierzähler, was überproportional viele Individuen ergibt, weil diese Tiere kleiner sind. Nicht gezählt: die Wildfische, die zu Futter für Zuchtlachs und Garnelen verarbeitet werden — eine große Menge, die wir nicht belastbar beziffern können. Und die CO₂-Zahl sagt nichts über Überfischung und Meeresböden, also über die eigentlichen ökologischen Probleme beim Fisch."},
{h:"Globale Durchschnitte verbergen viel",b:"Jede Umweltzahl hier ist ein globaler Median aus einem Datensatz. Reale Fußabdrücke schwanken enorm — Rind von einer gerodeten Weide und Rind aus einer Milchviehherde unterscheiden sich um etwa den Faktor drei, und dasselbe gilt zwischen Regionen und Haltungssystemen. Dein eigener Einkaufskorb ist nicht der Median. Nimm diese Kacheln als Größenordnungen, nicht als Messwerte, und vertrau der Richtung deutlich mehr als der Höhe."},
{h:"Zahlen, die wir bewusst nicht verwenden",b:"„Rund 1.100 Tiere pro Menschenleben“ — die einzelnen Posten lassen sich mit heutigen Daten nicht nachvollziehen. „Verarbeitetes Fleisch ist in derselben Kategorie wie Tabak“ — formal richtig und gründlich irreführend, weil die IARC-Gruppe beschreibt, wie sicher ein Zusammenhang ist, nicht wie groß das Risiko. „21 Tage machen eine Gewohnheit“ — steht in keiner Studie. „Du hast X Bäume kompensiert“ — Einzelbaumwerte schwanken um den Faktor fünf, und mehrere große Wälder sind zuletzt zur Netto-Kohlenstoffquelle geworden. „Du lebst X Tage länger“ — dafür gibt es keine belastbare Grundlage."},
{h:"Warum hier nichts auf null springt",b:"In der bekanntesten Gewohnheitsstudie senkte eine einzelne ausgelassene Gelegenheit die Automatisierung um weniger als einen halben Skalenpunkt und wurde schnell aufgeholt. Aus der Suchtforschung kommt zusätzlich die Idee, dass nicht der Ausrutscher den Versuch beendet, sondern die Bewertung danach — geprüft allerdings an Rauchenden und an Menschen mit gezügeltem Essverhalten, nicht an Leuten, die weniger Fleisch essen. Wir halten es trotzdem für das kleinere Risiko, keinen Zähler auf null springen zu lassen. Das ist eine Konstruktionsentscheidung, kein Studienergebnis."},
{h:"Das Kleingedruckte",b:"Diese App gibt keine ärztliche oder ernährungstherapeutische Beratung, stellt keine Diagnosen, nennt keine Dosierungen und berechnet kein persönliches Risiko. Wenn du Blutdrucksenker oder Antidiabetika nimmst, kann eine Ernährungsumstellung deine Werte spürbar verändern — ein Grund, die Ärztin einzubeziehen, kein Grund, es zu lassen, und nie ein Grund, Medikamente selbst anzupassen. Jede Zahl hier ist eine Schätzung auf Basis von Durchschnitten: deiner eigenen Angabe, Produktionsstatistiken und Ökobilanzen. Wenn das Nachdenken über Essen zwanghaft oder angstbesetzt wird, kann das ein Warnzeichen sein — diese App zeigt keine Kalorien und kein Körpergewicht, und sie wegzulegen ist jederzeit erlaubt."}
]

const LOCALES = { en:EN, de:DE };

/* ══════════════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════════════ */

const KEY = "meatless-since-v5";
let T = EN;

const nf = (a,b) => new Intl.NumberFormat(T.locale, {minimumFractionDigits:a, maximumFractionDigits:b===undefined?a:b});
const cur = () => (COUNTRIES[S && S.country] || COUNTRIES.US).cur;
const iso = d => { const z = new Date(d); return z.getFullYear()+"-"+String(z.getMonth()+1).padStart(2,"0")+"-"+String(z.getDate()).padStart(2,"0"); };
const midnight = s => { const p = String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]).getTime(); };

/* While the setup sheet is open the draft's units win, so the sliders
   switch the moment you pick, not once you finish. */
let unitsPreview = null;
function U(){ return UNITS[unitsPreview || (S && S.units) || "metric"]; }
const mass  = kg => nf(1).format(kg * U().mass.f) + " " + U().mass.u;
const small = g  => nf(0).format(g * U().small.f) + " " + U().small.u;
const dist  = km => nf(0).format(km * U().dist.f) + " " + U().dist.u;

/* Starting point before anyone has chosen anything. Only the US is
   assumed imperial; everything else starts metric. Language stays English
   until the user picks — that is deliberate, not an oversight. */
function guessDefaults(){
  let country = "GLOBAL", units = "metric";
  try{
    const tag = (navigator.language || "en-US");
    const region = (tag.split("-")[1] || "").toUpperCase();
    if(region === "US"){ country = "US"; units = "imperial"; }
    else if(["DE","AT","CH"].indexOf(region) >= 0){ country = "DE"; }
  }catch(e){}
  return { country, units };
}

function demoState(){
  const g = guessDefaults();
  const st = new Date(Date.now() - 152*864e5);
  const e = {};
  for(let i=0;i<34;i++){
    const d = iso(new Date(Date.now() - i*864e5));
    if(i===8) e[d] = {typ:"meat", art:"beef", g:220, note:"Birthday dinner"};
    else if(i===3 || i===17) e[d] = {typ:"eggdairy"};
    else if(i===11) e[d] = {typ:"unknown"};
    else if(i!==22 && i!==23) e[d] = {typ:"plant"};
  }
  return { v:6, demo:true, lang:"en", country:g.country, units:g.units,
           start:iso(st), w:Object.assign({}, COUNTRIES[g.country].w),
           mix:Object.assign({}, MIX_DEFAULT), focus:"animals",
           prices:{meat:{}, subs:{}}, entries:e, floor:{}, updatedAt:0 };
}

let S = demoState();
let dbRef = null, syncKey = "checking", saveTimer = null;

function loadLocal(){
  try{ const raw = localStorage.getItem(KEY) || localStorage.getItem("meatless-since-v4");
       if(!raw) return null;
       const o = JSON.parse(raw); return (o && o.start) ? o : null; }catch(e){ return null; }
}

/* Earlier versions used German keys and a laying-hen field. Remap, don't drop. */
const OLD_MEAT = { rind:"beef", schweinWurst:"pork", gefluegel:"poultry", fisch:"fish" };
const OLD_SUB  = { huelsen:"pulses", tofu:"tofu", ei:"eggs", kaese:"cheese", ersatz:"mock", nuesse:"nuts" };
const OLD_TYPE = { pflanzlich:"plant", eimilch:"eggdairy", fisch:"fish", fleisch:"meat", unbekannt:"unknown" };
function migrate(o){
  const out = Object.assign({}, o);
  if(o.w && o.w.rind !== undefined){
    const w = {}; for(const k in OLD_MEAT) if(o.w[k] !== undefined) w[OLD_MEAT[k]] = o.w[k];
    out.w = w;
  }
  const oldMix = o.mix && o.mix.huelsen !== undefined ? o.mix : o.ersatzMix;
  if(oldMix && oldMix.pulses === undefined){
    const m = {}; for(const k in OLD_SUB) if(oldMix[k] !== undefined) m[OLD_SUB[k]] = oldMix[k];
    out.mix = m;
  }
  const src = o.entries || o.eintraege;
  if(src){
    const en = {};
    for(const d in src){
      const e = Object.assign({}, src[d]);
      if(OLD_TYPE[e.typ]) e.typ = OLD_TYPE[e.typ];
      if(OLD_MEAT[e.art]) e.art = OLD_MEAT[e.art];
      if(e.was && !e.note){ e.note = e.was; delete e.was; }
      en[d] = e;
    }
    out.entries = en;
  }
  if(o.motiv !== undefined && o.focus === undefined)
    out.focus = ({tiere:"animals", co2:"co2", geld:"money", kg:"weight"})[o.motiv] || "animals";
  if(out.focus === "hens") out.focus = "animals";
  delete out.eier; delete out.eggs;
  if(!out.country) out.country = "DE";
  /* Up to v5 the substitute prices people typed were per kilo of MEAT REPLACED.
     From v6 the editor asks for the shelf price of the product itself, so divide
     the stored figure back out. Without this, saved prices would silently shift
     by the `buy` factor. */
  if((o.v || 0) < 6 && out.prices && out.prices.subs){
    const s = {};
    for(const k in out.prices.subs){
      if(SUBS[k] && typeof out.prices.subs[k] === "number") s[k] = out.prices.subs[k] / SUBS[k].buy;
    }
    out.prices = { meat:(out.prices.meat || {}), subs:s };
  }
  return out;
}

function normalize(raw){
  const o = migrate(raw);
  const base = demoState();
  const s = Object.assign(base, o, {demo:false});
  s.w = Object.assign({}, base.w, o.w || {});
  s.mix = Object.assign({}, MIX_DEFAULT, o.mix || {});
  s.entries = o.entries || {};
  s.floor = o.floor || {};
  s.prices = { meat:(o.prices && o.prices.meat) || {}, subs:(o.prices && o.prices.subs) || {} };
  if(!COUNTRIES[s.country]) s.country = "US";
  if(!UNITS[s.units]) s.units = COUNTRIES[s.country].units;
  if(!LOCALES[s.lang]) s.lang = "en";
  s.v = 6;
  return s;
}
function commit(){
  S.demo = false; S.updatedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(dbRef){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      dbRef.set(JSON.parse(JSON.stringify(S))).then(()=>setSync("synced")).catch(()=>setSync("local"));
    }, 400);
  }
  render();
}
function setSync(k){ syncKey = k; const el = document.getElementById("syncLine");
  if(el) el.innerHTML = esc(T.ui.storage)+": <b>"+esc(T.ui.sync[k] || k)+"</b>"; }

(function boot(){
  const local = loadLocal();
  if(local) S = normalize(local);
  T = LOCALES[S.lang] || EN;
  try{ const th = localStorage.getItem(KEY+"-theme"); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}
})();

if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("db").then(db=>{
    if(!db){ setSync("local"); return; }
    dbRef = db.doc("tracker/profile");
    dbRef.onSnapshot(snap=>{
      if(!snap.exists){ setSync(S.demo ? "ready" : "synced"); if(!S.demo) commit(); return; }
      const d = snap.data();
      if(d && typeof d.updatedAt === "number" && d.updatedAt > (S.updatedAt||0)){
        S = normalize(d); T = LOCALES[S.lang] || EN;
        try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
        render();
      }
      setSync("synced");
    }, ()=> setSync("local"));
  }).catch(()=> setSync("local"));
} else { setSync("local"); }

/* ══════════════════════════════════════════════════════════════════════
   MATH
   ══════════════════════════════════════════════════════════════════════ */

function meatPrice(a){
  const o = S.prices && S.prices.meat && S.prices.meat[a];
  return (o === 0 || o) ? o : MEAT[a].price[S.country || "US"];
}
/* Shelf price per kilo of the product itself — this is what the editor shows. */
function subPrice(k){
  const o = S.prices && S.prices.subs && S.prices.subs[k];
  return (o === 0 || o) ? o : SUBS[k].shop[S.country || "US"];
}
/* What that works out to per kilo of meat replaced — this is what the maths uses. */
const subCostPerKgMeat = k => subPrice(k) * SUBS[k].buy;

function mixValues(mix){
  const m = mix || MIX_DEFAULT;
  let sum = 0;
  for(const k in SUBS) sum += Math.max(0, m[k] || 0);
  if(sum <= 0) return { co2:SUBS.pulses.co2, land:SUBS.pulses.land, water:SUBS.pulses.water,
                        price:subCostPerKgMeat("pulses"), shares:[{k:"pulses", p:100}] };
  const out = {co2:0, land:0, water:0, price:0, shares:[]};
  for(const k in SUBS){
    const p = Math.max(0, m[k] || 0) / sum;
    if(p <= 0) continue;
    out.co2 += SUBS[k].co2 * p; out.land += SUBS[k].land * p;
    out.water += SUBS[k].water * p; out.price += subCostPerKgMeat(k) * p;
    out.shares.push({k, p:Math.round(p*100)});
  }
  out.shares.sort((a,b)=>b.p-a.p);
  return out;
}
const mixLabel = mv => mv.shares.map(s=>T.ui.subNames[s.k]+" "+s.p+"%").join(" · ");

/* Average CO2e saved per kilo of meat, given a meat composition and a
   replacement mix. Only used as a ratio against the reference case, so it
   modulates the measured level without setting it. */
function netPerKg(w, mv){
  let sum = 0, acc = 0;
  for(const a in MEAT) sum += (w[a] || 0);
  if(sum <= 0) return 0;
  for(const a in MEAT) acc += ((w[a] || 0) / sum) * (MEAT[a].co2 - mv.co2);
  return acc;
}

function computeAt(nowMs){
  const startMs = midnight(S.start);
  const ms = Math.max(0, nowMs - startMs);
  const weeks = ms / 6048e5, days = ms / 864e5;
  const country = S.country || "US";

  const logged = {beef:0, pork:0, poultry:0, fish:0};
  let vegTotal = 0;
  for(const d in S.entries){
    if(d < S.start) continue;
    const e = S.entries[d];
    if(e.typ === "meat"){ logged[logged[e.art] !== undefined ? e.art : "pork"] += (e.g || K.portionG)/1000; }
    else if(e.typ === "fish"){ logged.fish += (e.g || K.portionG)/1000; }
    else if(e.typ === "plant" || e.typ === "eggdairy"){ vegTotal++; }
  }

  const kg = {}; let kgSum = 0;
  for(const a in MEAT){ kg[a] = Math.max(0, (S.w[a]||0)/1000*weeks - logged[a]); kgSum += kg[a]; }

  const kgChicken = kg.poultry * POULTRY_MIX.chicken, kgTurkey = kg.poultry * POULTRY_MIX.turkey;
  const landedKg = kg.fish * FISH.filletToLanded;
  const byWeight = landedKg * FISH.bycatchRatio;
  const byArt = {
    chicken: kgChicken / YIELD.chicken, turkey: kgTurkey / YIELD.turkey,
    pig: kg.pork / YIELD.pig, cattle: kg.beef / YIELD.cattle,
    fish: landedKg * FISH.perKgLanded, bycatch: byWeight * FISH.bycatchPerKg
  };
  const animals = byArt.chicken + byArt.turkey + byArt.pig + byArt.cattle + byArt.fish + byArt.bycatch;

  const e = mixValues(S.mix);
  let water = 0, area_ = 0;
  for(const a in MEAT){
    water += kg[a] * (MEAT[a].water - e.water);
    area_ += kg[a] * (MEAT[a].land  - e.land);
  }

  /* Climate: the measured curve sets the level, the bottom-up net-per-kilo
     only scales it, so the replacement mix still moves this number. Logged
     meat days reduce it in the same proportion as they reduce the kilos. */
  let grossKg = 0;
  for(const a in MEAT) grossKg += (S.w[a] || 0)/1000 * weeks;
  const loggedFactor = grossKg > 0 ? kgSum / grossKg : 1;
  const meatGPerDay = ((S.w.beef||0) + (S.w.pork||0) + (S.w.poultry||0)) / 7;
  const refNet = netPerKg(COUNTRIES[country].w, mixValues(MIX_DEFAULT));
  const co2PerYear = measuredDailySaving(meatGPerDay) * 365 *
                     (refNet !== 0 ? netPerKg(S.w, e) / refNet : 1);
  const co2 = co2PerYear * (days / 365) * loggedFactor;
  let meatSpend = 0;
  for(const a in MEAT) meatSpend += (kg[a] || 0) * meatPrice(a);
  const money = (meatSpend - kgSum * e.price) * K.homeShare;

  /* Gross per-day rates. Quantity milestones derive their day from these
     instead of carrying a hard-coded one, so they can never drift out of
     step with the counters again. */
  const kgDay = {}; let kgDaySum = 0, spendDay = 0;
  for(const a in MEAT){ kgDay[a] = (S.w[a]||0)/1000/7; kgDaySum += kgDay[a]; spendDay += kgDay[a] * meatPrice(a); }
  const rates = {
    co2:     co2PerYear / 365,
    money:   (spendDay - kgDaySum * e.price) * K.homeShare,
    chicken: kgDay.poultry * POULTRY_MIX.chicken / YIELD.chicken,
    pig:     kgDay.pork / YIELD.pig
  };

  let winVeg = 0, winLogged = 0;
  const dots = [];
  for(let i = K.windowDays-1; i >= 0; i--){
    const d = iso(new Date(nowMs - i*864e5));
    const en = (d >= S.start) ? S.entries[d] : undefined;
    let t = "empty";
    if(en){
      winLogged++;
      if(en.typ === "plant" || en.typ === "eggdairy"){ t = "veg"; winVeg++; }
      else if(en.typ === "fish") t = "fish";
      else if(en.typ === "meat") t = "meat";
      else t = "unknown";
    }
    dots.push({d, t, today: i === 0});
  }
  const yest = iso(new Date(nowMs - 864e5)), today = iso(new Date(nowMs));
  const comeback = S.entries[yest] && S.entries[yest].typ === "meat" && !S.entries[today];

  const raw = { ms, days, weeks, kg, kgSum, animals, byArt, byWeight,
    co2, water, area:area_, money,
    vegTotal, winVeg, winLogged, dots, comeback, rates, e };

  const fl = S.floor || {};
  raw.animals = Math.max(raw.animals, fl.animals || 0);
  raw.kgSum = Math.max(raw.kgSum, fl.kgSum || 0);
  raw.money = Math.max(raw.money, fl.money === undefined ? -Infinity : fl.money);
  raw.vegTotal = Math.max(raw.vegTotal, fl.vegTotal || 0);
  if(raw.co2 >= 0) raw.co2 = Math.max(raw.co2, fl.co2 || 0);
  if(raw.water >= 0) raw.water = Math.max(raw.water, fl.water || 0);
  if(raw.area >= 0) raw.area = Math.max(raw.area, fl.area || 0);
  return raw;
}
const compute = () => computeAt(Date.now());

function setFloor(){
  const c = computeAt(Date.now());
  S.floor = { animals:c.animals, kgSum:c.kgSum, money:c.money, co2:c.co2,
              water:c.water, area:c.area, vegTotal:c.vegTotal };
}

/* Everything a locale's eq() might need, precomputed. */
function eqCtx(c){
  const a = c.area * U().area.f;
  const fp = COUNTRIES[S.country||"US"].footprint;
  return { n0:x=>nf(0).format(x), n1:x=>nf(1).format(x), n2:x=>nf(2).format(x),
           small, mass, dist, cur:cur(),
           tubs:(c.water*U().vol.f)/U().tub, pitches:a/U().pitch, spots:a/U().spot,
           share:c.days > 14 ? (c.co2/c.days*365)/fp*100 : null };
}

/* Milestones that name a QUANTITY carry the threshold itself (`q`) and their
   day is derived from your actual rate, so they always agree with the tiles.
   Everything titled by time stays on the calendar — otherwise "Ten days in"
   lands on day four. A threshold you are not on course for returns null and
   drops out of the journey rather than dangling forever. */
/* NB: `q` is the citation string on every milestone — the threshold lives on
   `at` so the two cannot collide. */
function scaled(m, c){
  if(!m.at) return m.d;
  const r = c.rates[m.at.m];
  return (r > 0) ? m.at.v / r : null;
}

function renderNext(c){
  const u = T.ui;
  const list = T.milestones.map(m=>({m, d:scaled(m,c)})).filter(x=>x.d !== null).sort((a,b)=>a.d-b.d);
  const next = list.find(x => x.d > c.days);
  if(!next){ $("#nextBox").innerHTML = '<div class="lbl">'+esc(u.doneLabel)+'</div>'+
    '<h3>'+esc(u.doneH)+'</h3><p>'+esc(u.doneP)+'</p>'; return; }
  const prevs = list.filter(x => x.d <= c.days);
  const from = prevs.length ? prevs[prevs.length-1].d : 0;
  const pct = Math.max(0, Math.min(100, (c.days - from)/(next.d - from)*100));
  const left = Math.ceil(next.d - c.days);
  $("#nextBox").innerHTML =
    '<div class="lbl">'+esc(u.nextLabel)+'</div><h3>'+esc(next.m.t)+'</h3><p>'+esc(next.m.b)+'</p>'+
    '<div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
    '<div class="bar-foot"><span>'+esc(u.dayN(nf(0).format(Math.floor(c.days))))+'</span>'+
    '<span>'+esc(u.expectedIn(nf(0).format(left), left===1?u.day:u.days))+'</span></div>';
}
